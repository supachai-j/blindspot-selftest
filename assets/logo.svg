<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Hard shadow (neo-brutalist offset shadow) -->
  <rect x="22" y="22" width="210" height="210" rx="54" fill="#14121F"/>

  <!-- Backdrop badge -->
  <rect x="8" y="8" width="210" height="210" rx="54" fill="#D4FF3D" stroke="#14121F" stroke-width="8"/>

  <!-- Sparkle accents -->
  <g fill="#FF3D80" stroke="#14121F" stroke-width="3" stroke-linejoin="round">
    <path d="M40 46 L46 58 L58 64 L46 70 L40 82 L34 70 L22 64 L34 58 Z"/>
  </g>
  <g fill="#FFFFFF" stroke="#14121F" stroke-width="3" stroke-linejoin="round">
    <path d="M188 168 L192 178 L202 182 L192 186 L188 196 L184 186 L174 182 L184 178 Z"/>
  </g>

  <!-- Legs (drawn first, behind body) -->
  <ellipse cx="98" cy="182" rx="15" ry="10" fill="#FF9FC2" stroke="#14121F" stroke-width="6"/>
  <ellipse cx="140" cy="182" rx="15" ry="10" fill="#FF9FC2" stroke="#14121F" stroke-width="6"/>

  <!-- Left arm (relaxed, down by side) -->
  <path d="M62 122 C46 126 40 140 46 152 C50 160 62 160 66 150"
        fill="#FF9FC2" stroke="#14121F" stroke-width="6" stroke-linejoin="round"/>

  <!-- Right arm (bent up, hand near head - "thinking/confused" pose, tucked close to body) -->
  <path d="M170 104 C184 100 190 86 184 76 C179 68 168 70 165 80 C163 88 166 98 172 104"
        fill="#FF9FC2" stroke="#14121F" stroke-width="6" stroke-linejoin="round"/>

  <!-- Brain body -->
  <path d="M60 116
           C58 74 84 44 118 42
           C154 40 182 66 184 106
           C186 146 160 174 120 176
           C82 178 62 154 60 116 Z"
        fill="#FF9FC2" stroke="#14121F" stroke-width="7" stroke-linejoin="round"/>

  <!-- brain fold texture (top) -->
  <g fill="none" stroke="#14121F" stroke-width="5" stroke-linecap="round">
    <path d="M78 72 C84 62 96 60 102 68"/>
    <path d="M108 60 C114 50 128 48 136 56"/>
    <path d="M142 66 C150 58 162 60 168 70"/>
  </g>

  <!-- center crease -->
  <path d="M121 44 C112 88 128 136 118 174" fill="none" stroke="#14121F" stroke-width="5" stroke-linecap="round"/>

  <!-- Left eye: open + cute -->
  <circle cx="94" cy="112" r="15" fill="#FFFFFF" stroke="#14121F" stroke-width="5"/>
  <circle cx="97" cy="114" r="6.5" fill="#14121F"/>
  <circle cx="94.5" cy="111" r="2.2" fill="#FFFFFF"/>
  <!-- left eyebrow -->
  <path d="M80 96 C86 90 100 90 106 96" fill="none" stroke="#14121F" stroke-width="4" stroke-linecap="round"/>

  <!-- Right eye: covered by a round monocle lens (the "blind spot") -->
  <circle cx="140" cy="112" r="18" fill="#14121F" stroke="#14121F" stroke-width="5"/>
  <path d="M130 102 C136 98 146 98 150 104" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- monocle chain -->
  <path d="M156 122 C168 128 172 140 166 150" fill="none" stroke="#14121F" stroke-width="4" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="74" cy="132" rx="8" ry="5" fill="#FF3D80" opacity="0.55"/>
  <ellipse cx="160" cy="130" rx="8" ry="5" fill="#FF3D80" opacity="0.55"/>

  <!-- Smile (centered, higher up for a friendlier look) -->
  <path d="M104 138 C112 146 128 146 136 138" fill="none" stroke="#14121F" stroke-width="5" stroke-linecap="round"/>
</svg>
