<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">แบบทดสอบ: คนตาบอดทางความคิด (Cognitive Blind Spot Self-Test)</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1f232c; --text:#e8eaed; --muted:#9aa1ab;
    --accent:#5b8def; --good:#3fbf7f; --mid:#e0b23e; --bad:#e2574c; --border:#2a2f3a;
    --disclaimer-bg:#241f1a; --disclaimer-border:#4a3a20; --disclaimer-text:#d8c39a;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --card:#ffffff; --card2:#eef0f4; --text:#1c1e24; --muted:#5b616e;
    --accent:#3766d6; --good:#1f9d5c; --mid:#b3830a; --bad:#c93a2f; --border:#dde1e8;
    --disclaimer-bg:#fdf3e0; --disclaimer-border:#e8cf9a; --disclaimer-text:#7a5a17;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; transition:background .2s, color .2s;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
  .topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;}
  .toggle-btn{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:7px 12px;border-radius:8px;font-size:0.85rem;cursor:pointer;font-weight:600;
  }
  .toggle-btn:hover{border-color:var(--accent);}
  header{text-align:center;margin-bottom:24px;}
  header h1{font-size:1.5rem;margin-bottom:6px;}
  header p{color:var(--muted);font-size:0.92rem;margin:4px 0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;border:none;padding:12px 22px;
    border-radius:10px;font-size:1rem;cursor:pointer;font-weight:600;
  }
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap;}
  #progressBar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin-bottom:18px;}
  #progressFill{height:100%;background:var(--accent);width:0%;transition:width .25s;}
  .qcount{color:var(--muted);font-size:0.85rem;margin-bottom:8px;}
  .qtext{font-size:1.08rem;margin-bottom:20px;}
  .likert{display:flex;flex-direction:column;gap:8px;}
  .likert label{
    display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card2);
    border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s;
  }
  .likert label:hover{border-color:var(--accent);}
  .likert input{accent-color:var(--accent);width:18px;height:18px;}
  .likert label.selected{border-color:var(--accent);}
  html[data-theme="dark"] .likert label.selected{background:#20283a;}
  html[data-theme="light"] .likert label.selected{background:#e7edfb;}
  .domain-bar-wrap{margin-bottom:16px;}
  .domain-bar-label{display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:4px;}
  .domain-bar-bg{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;}
  .domain-bar-fill{height:100%;border-radius:6px;}
  .domain-note{color:var(--muted);font-size:0.82rem;margin-top:4px;}
  .overall{text-align:center;padding:18px 0;}
  .overall .score{font-size:2.6rem;font-weight:700;}
  .badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:0.85rem;font-weight:600;margin-top:8px;}
  .badge.risk{background:#3a2325;color:var(--bad);}
  .badge.mid{background:#3a3323;color:var(--mid);}
  .badge.good{background:#1f3a2c;color:var(--good);}
  .badge.warn{background:#2a2a3a;color:#b39ddb;}
  html[data-theme="light"] .badge.risk{background:#fbe4e1;}
  html[data-theme="light"] .badge.mid{background:#faf0d6;}
  html[data-theme="light"] .badge.good{background:#dff3e6;}
  html[data-theme="light"] .badge.warn{background:#ece7fb;}
  textarea{
    width:100%;min-height:80px;background:var(--card2);border:1px solid var(--border);
    border-radius:10px;color:var(--text);padding:12px;font-family:inherit;font-size:0.95rem;resize:vertical;
  }
  .reflect-q{font-weight:600;margin-top:16px;margin-bottom:6px;font-size:0.95rem;}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:500;}
  footer{color:var(--muted);font-size:0.78rem;margin-top:30px;line-height:1.7;}
  footer a{color:var(--accent);}
  .hidden{display:none !important;}
  .small{font-size:0.85rem;color:var(--muted);}
  .disclaimer{background:var(--disclaimer-bg);border:1px solid var(--disclaimer-border);border-radius:10px;padding:12px 14px;font-size:0.83rem;color:var(--disclaimer-text);margin-bottom:18px;}
  .devplan-title{font-size:1.05rem;font-weight:700;margin-bottom:12px;}
  .devplan-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .devplan-card.priority{border-color:var(--accent);}
  .devplan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .devplan-head b{font-size:0.95rem;}
  .devplan-tag{font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent);color:#fff;}
  .devplan-tag.ok{background:var(--good);}
  .devplan-action{font-size:0.87rem;margin:6px 0;}
  .devplan-links{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .devplan-links a{color:var(--accent);font-size:0.82rem;text-decoration:none;}
  .devplan-links a:hover{text-decoration:underline;}
  .devplan-links .src-tag{color:var(--muted);font-size:0.72rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="toggle-btn" id="langToggle" onclick="toggleLang()">EN</button>
    <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
  </div>
  <header>
    <h1 id="hTitle">🧠 คนตาบอดทางความคิด</h1>
    <p id="hSubtitle">Cognitive Blind Spot Self-Test — เครื่องมือสะท้อนตัวเอง (self-reflection)</p>
  </header>

  <div class="disclaimer" id="disclaimerText"></div>

  <!-- INTRO -->
  <div id="intro" class="card">
    <p id="introP1"></p>
    <ul class="small" id="introList"></ul>
    <p class="small" id="introP2"></p>
    <div id="historyPreview"></div>
    <div class="btn-row">
      <button class="btn" id="startBtn" onclick="startQuiz()"></button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="card hidden">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div class="qcount"></div>
    <div class="qtext"></div>
    <div class="likert" id="likertOptions"></div>
    <div class="btn-row">
      <button class="btn secondary" id="prevBtn" onclick="prevQ()"></button>
      <button class="btn" id="nextBtn" onclick="nextQ()" disabled></button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results" class="card hidden">
    <div class="overall">
      <div class="small" id="scoreLabel"></div>
      <div class="score" id="overallScore">-</div>
      <div id="overallBadge"></div>
    </div>
    <div id="domainBars"></div>
    <hr style="border-color:var(--border);margin:20px 0;">
    <div id="interpretation"></div>

    <hr style="border-color:var(--border);margin:20px 0;">
    <div id="devPlanSection"></div>

    <div style="margin-top:24px;">
      <div class="reflect-q" id="steelmanTitle"></div>
      <p class="small" id="steelmanDesc"></p>
      <textarea id="steelman"></textarea>

      <div class="reflect-q" id="disconfirmTitle"></div>
      <p class="small" id="disconfirmDesc"></p>
      <textarea id="disconfirm"></textarea>
      <div class="btn-row">
        <button class="btn secondary" id="saveReflectionBtn" onclick="saveReflection()"></button>
      </div>
    </div>

    <div style="margin-top:24px;" id="historySection"></div>

    <div class="btn-row">
      <button class="btn secondary" id="restartBtn" onclick="restartQuiz()"></button>
      <button class="btn secondary" id="exportBtn" onclick="exportResult()"></button>
      <button class="btn secondary" id="clearBtn" onclick="clearHistory()"></button>
    </div>
  </div>

  <footer id="footerText"></footer>
</div>

// ---------- Navigation ----------
function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[current];
  document.querySelector('.qcount').textContent = t('qcount')(current+1, QUESTIONS.length, DOMAINS[q.d].name[LANG]);
  document.querySelector('.qtext').textContent = q.t[LANG];
  document.getElementById('progressFill').style.width = `${(current/QUESTIONS.length)*100}%`;

  const wrap = document.getElementById('likertOptions');
  wrap.innerHTML = '';
  LIKERT.forEach(opt=>{
    const id = `opt_${opt.v}`;
    const label = document.createElement('label');
    label.innerHTML = `<input type="radio" name="likert" value="${opt.v}" id="${id}"> ${opt.l[LANG]}`;
    if(answers[current] === opt.v) label.classList.add('selected');
    label.onclick = ()=>{
      answers[current] = opt.v;
      document.getElementById('nextBtn').disabled = false;
      document.querySelectorAll('.likert label').forEach(l=>l.classList.remove('selected'));
      label.classList.add('selected');
    };
    wrap.appendChild(label);
  });

  document.getElementById('prevBtn').style.visibility = current===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').disabled = answers[current] === null;
  document.getElementById('nextBtn').textContent = current === QUESTIONS.length-1 ? t('resultBtn') : t('nextBtn');
}

function nextQ(){
  if(answers[current] === null) return;
  if(current === QUESTIONS.length-1){
    showResults();
  } else {
    current++;
    renderQuestion();
  }
}
function prevQ(){
  if(current===0) return;
  current--;
  renderQuestion();
}

// ---------- Scoring ----------
function computeScores(){
  const domainSums = {}; const domainCounts = {};
  Object.keys(DOMAINS).forEach(d=>{domainSums[d]=0;domainCounts[d]=0;});
  QUESTIONS.forEach((q,i)=>{
    let raw = answers[i];
    let score = q.reverse ? (6-raw) : raw;
    domainSums[q.d]+=score;
    domainCounts[q.d]+=1;
  });
  const domainScores = {};
  Object.keys(DOMAINS).forEach(d=>{
    domainScores[d] = domainSums[d]/domainCounts[d];
  });
  const overall = Object.values(domainScores).reduce((a,b)=>a+b,0)/Object.keys(domainScores).length;
  return {domainScores, overall};
}

function scoreColor(v){
  if(v < 2.5) return 'var(--bad)';
  if(v < 3.5) return 'var(--mid)';
  return 'var(--good)';
}

function showResults(skipSave){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const {domainScores, overall} = computeScores();

  document.getElementById('overallScore').textContent = overall.toFixed(2);
  document.getElementById('overallScore').style.color = scoreColor(overall);

  const badgeEl = document.getElementById('overallBadge');
  let badgeClass, badgeText;
  const badges = t('badges');
  if(overall >= 4.6){ badgeClass='warn'; badgeText=badges.warn; }
  else if(overall >= 3.5){ badgeClass='good'; badgeText=badges.good; }
  else if(overall >= 2.5){ badgeClass='mid'; badgeText=badges.mid; }
  else { badgeClass='risk'; badgeText=badges.risk; }
  badgeEl.innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span>`;

  const barsEl = document.getElementById('domainBars');
  barsEl.innerHTML = '';
  Object.keys(DOMAINS).forEach(d=>{
    const val = domainScores[d];
    const pct = (val/5)*100;
    const div = document.createElement('div');
    div.className = 'domain-bar-wrap';
    div.innerHTML = `
      <div class="domain-bar-label"><span>${d} — ${DOMAINS[d].name[LANG]}</span><span>${val.toFixed(2)} / 5.0</span></div>
      <div class="domain-bar-bg"><div class="domain-bar-fill" style="width:${pct}%;background:${scoreColor(val)}"></div></div>
      <div class="domain-note">${DOMAINS[d].desc[LANG]}</div>
    `;
    barsEl.appendChild(div);
  });

  document.getElementById('interpretation').innerHTML = buildInterpretation(domainScores, overall);
  renderDevPlan(domainScores);

  if(!skipSave){
    saveToHistory(domainScores, overall);
  }
  renderHistory();
}

function buildInterpretation(domainScores, overall){
  let weakest = Object.keys(domainScores).reduce((a,b)=> domainScores[a]<domainScores[b]?a:b);
  let html = t('focusLabel')(weakest, DOMAINS[weakest].name[LANG]);
  html += `<p class="small">${RECS[weakest][LANG]}</p>`;
  if(overall >= 4.6){
    html += t('overconfidenceWarning');
  }
  return html;
}

function renderDevPlan(domainScores){
  // Sort domains ascending by score = weakest (needs focus) first
  const sorted = Object.keys(domainScores).sort((a,b)=> domainScores[a]-domainScores[b]);
  let html = `<div class="devplan-title">${t('devPlanTitle')}</div>`;
  html += `<p class="small" style="margin-bottom:14px;">${t('devPlanIntro')}</p>`;
  sorted.forEach((d, idx)=>{
    const val = domainScores[d];
    const isPriority = idx === 0;
    const isStrong = val >= 4.0 && idx === sorted.length-1;
    const tagHtml = isPriority
      ? `<span class="devplan-tag">${t('priorityTag')}</span>`
      : (isStrong ? `<span class="devplan-tag ok">${t('okTag')}</span>` : '');
    const links = (READING_LIST[d]||[]).map(r=>
      `<a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.label} <span class="src-tag">(${r.src})</span></a>`
    ).join('');
    html += `
      <div class="devplan-card ${isPriority?'priority':''}">
        <div class="devplan-head">
          <b>${d} — ${DOMAINS[d].name[LANG]} (${val.toFixed(2)}/5.0)</b>
          ${tagHtml}
        </div>
        <div class="devplan-action">${RECS[d][LANG]}</div>
        <div class="devplan-links">
          <div class="small" style="font-weight:600;">${t('readMoreLabel')}</div>
          ${links}
        </div>
      </div>`;
  });
  document.getElementById('devPlanSection').innerHTML = html;
}

// ---------- Reflection ----------
function saveReflection(){
  const steelman = document.getElementById('steelman').value.trim();
  const disconfirm = document.getElementById('disconfirm').value.trim();
  if(!steelman && !disconfirm){ alert(t('saveReflectionEmpty')); return; }
  const hist = getHistory();
  if(hist.length>0){
    hist[hist.length-1].reflection = {steelman, disconfirm};
    setHistory(hist);
  }
  alert(t('saveReflectionDone'));
}

// ---------- History (localStorage) ----------
function getHistory(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; }
}
function setHistory(h){ localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }

function saveToHistory(domainScores, overall){
  const hist = getHistory();
  hist.push({
    date: new Date().toISOString(),
    overall: Number(overall.toFixed(2)),
    domains: Object.fromEntries(Object.entries(domainScores).map(([k,v])=>[k, Number(v.toFixed(2))]))
  });
  setHistory(hist);
}

function localeForLang(){ return LANG === 'th' ? 'th-TH' : 'en-US'; }

function renderHistory(){
  const hist = getHistory();
  const el = document.getElementById('historySection');
  if(hist.length <= 1){ el.innerHTML=''; return; }
  const cols = t('historyCols');
  let rows = hist.slice().reverse().map(h=>{
    const d = new Date(h.date);
    return `<tr><td>${d.toLocaleDateString(localeForLang())} ${d.toLocaleTimeString(localeForLang(),{hour:'2-digit',minute:'2-digit'})}</td>
      <td>${h.overall}</td>
      <td>${Object.entries(h.domains).map(([k,v])=>`${k}:${v}`).join(' · ')}</td></tr>`;
  }).join('');
  el.innerHTML = `<div class="reflect-q">${t('historyTitle')(hist.length)}</div>
    <table><thead><tr><th>${cols[0]}</th><th>${cols[1]}</th><th>${cols[2]}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderHistoryPreview(){
  const hist = getHistory();
  const el = document.getElementById('historyPreview');
  if(hist.length===0){ el.innerHTML=''; return; }
  const last = hist[hist.length-1];
  const d = new Date(last.date);
  el.innerHTML = `<p class="small">${t('historyPreview')(d.toLocaleDateString(localeForLang()), last.overall, hist.length)}</p>`;
}

function clearHistory(){
  if(confirm(t('clearConfirm'))){
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
    renderHistoryPreview();
    alert(t('clearDone'));
  }
}

function restartQuiz(){
  document.getElementById('results').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('steelman').value='';
  document.getElementById('disconfirm').value='';
  renderHistoryPreview();
}

function exportResult(){
  const {domainScores, overall} = computeScores();
  let text = t('exportHeader')(new Date().toLocaleDateString(localeForLang())) + '\n';
  text += t('exportTotal')(overall.toFixed(2)) + '\n\n';
  Object.keys(DOMAINS).forEach(d=>{
    text += `${d} (${DOMAINS[d].name[LANG]}): ${domainScores[d].toFixed(2)} / 5.0\n`;
  });
  text += `\n${t('exportFooter')}`;
  navigator.clipboard.writeText(text).then(()=>{
    alert(t('exportCopied'));
  }).catch(()=>{
    prompt(t('exportPromptLabel'), text);
  });
}

// init
applyTheme();
applyLang();
</script>
</body>
</html>
