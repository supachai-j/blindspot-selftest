<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">แบบทดสอบ: คนตาบอดทางความคิด (Cognitive Blind Spot Self-Test)</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B10; --surface:#15151C; --surface2:#1E1E28; --ink:#F5F4FF; --muted:#9B97B8;
    --line:#F5F4FF; --shadow-color:#D4FF3D;
    --accent:#D4FF3D; --accent-ink:#0B0B10;
    --pink:#FF3D80; --good:#3DFFC1; --mid:#FFD23D; --bad:#FF4D6D;
    --disclaimer-bg:#241f1a; --disclaimer-text:#e8d19a;
  }
  html[data-theme="light"]{
    --bg:#F6F3E7; --surface:#FFFFFF; --surface2:#F1EEDD; --ink:#14121F; --muted:#5C5870;
    --line:#14121F; --shadow-color:#14121F;
    --accent:#A9D62A; --accent-ink:#0B0B10;
    --pink:#E0245E; --good:#128A57; --mid:#B78600; --bad:#D93636;
    --disclaimer-bg:#FCEFD3; --disclaimer-text:#6B4E10;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Space Grotesk','Noto Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; transition:background .2s, color .2s;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .toggles{display:flex;gap:8px;}
  .toggle-btn{
    background:var(--surface2);border:2px solid var(--line);color:var(--ink);
    padding:9px 14px;border-radius:999px;font-size:0.82rem;cursor:pointer;font-weight:800;
    box-shadow:3px 3px 0 var(--shadow-color);transition:transform .12s ease, box-shadow .12s ease;
    min-height:40px;font-family:inherit;
  }
  .toggle-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow-color);}
  .toggle-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-color);}
  .eyebrow{
    display:inline-block;background:var(--pink);color:#fff;font-weight:800;font-size:0.7rem;
    letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:2px solid var(--line);margin-bottom:10px;
  }
  header{text-align:center;margin-bottom:22px;}
  header h1{font-size:1.9rem;margin:0 0 8px;font-weight:800;letter-spacing:-.01em;}
  header p{color:var(--muted);font-size:0.95rem;margin:4px 0;font-family:'Noto Sans Thai',sans-serif;font-weight:400;}
  .card{
    background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:22px;
    margin-bottom:20px;box-shadow:6px 6px 0 var(--shadow-color);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);
    padding:13px 24px;border-radius:999px;font-size:1rem;cursor:pointer;font-weight:800;
    box-shadow:5px 5px 0 var(--shadow-color);transition:transform .12s ease, box-shadow .12s ease;
    font-family:inherit;min-height:48px;
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow-color);}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow-color);}
  .btn.secondary{background:var(--surface2);color:var(--ink);}
  .btn.danger{background:var(--bad);color:#fff;}
  .btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:3px 3px 0 var(--shadow-color);transform:none;}
  .btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap;}
  .btn-row .btn{flex:1 1 auto;}
  #progressBar{height:16px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px;}
  #progressFill{height:100%;background:var(--accent);width:0%;transition:width .3s ease;}
  #progressBarPeer{height:16px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px;}
  #peerProgressFill{height:100%;background:var(--pink);width:0%;transition:width .3s ease;}
  .qcount{
    display:inline-block;color:var(--ink);font-size:0.78rem;font-weight:800;margin-bottom:10px;
    background:var(--surface2);border:2px solid var(--line);border-radius:999px;padding:5px 12px;
  }
  .qtext{font-size:1.5rem;line-height:1.5;margin-bottom:24px;font-weight:700;font-family:'Noto Sans Thai',sans-serif;}
  @media (min-width:480px){ .qtext{font-size:1.65rem;} }
  .mood-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .mood-chip{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 8px;background:var(--surface2);border:3px solid var(--line);border-radius:16px;
    cursor:pointer;box-shadow:4px 4px 0 var(--shadow-color);transition:transform .12s ease, box-shadow .12s ease;
    text-align:center;font-weight:700;font-size:0.82rem;min-height:48px;font-family:'Noto Sans Thai',sans-serif;
  }
  .mood-chip .emoji{font-size:1.9rem;font-family:initial;}
  .mood-chip:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-color);}
  .mood-chip.selected{background:var(--accent);color:var(--accent-ink);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow-color);}
  .sr-radio{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .domain-bar-wrap{margin-bottom:16px;}
  .domain-bar-label{display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:5px;font-weight:700;}
  .domain-bar-bg{height:16px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;overflow:hidden;}
  .domain-bar-fill{height:100%;border-radius:999px;}
  .domain-note{color:var(--muted);font-size:0.82rem;margin-top:4px;font-family:'Noto Sans Thai',sans-serif;}
  .overall{text-align:center;padding:14px 0 6px;}
  .score-ring{
    display:inline-flex;align-items:center;justify-content:center;width:140px;height:140px;
    border-radius:50%;background:var(--surface2);border:4px solid var(--line);
    box-shadow:6px 6px 0 var(--shadow-color);margin:12px 0;
  }
  .overall .score{font-size:2.4rem;font-weight:800;}
  .badge{
    display:inline-block;padding:8px 16px;border-radius:999px;font-size:0.85rem;font-weight:800;
    margin-top:6px;border:2px solid var(--line);
  }
  .badge.risk{background:var(--bad);color:#fff;}
  .badge.mid{background:var(--mid);color:#14121F;}
  .badge.good{background:var(--good);color:#0B0B10;}
  .badge.warn{background:var(--pink);color:#fff;}
  @media (prefers-reduced-motion: no-preference){
    @keyframes popIn{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
    .badge{animation:popIn .4s ease both;}
  }
  textarea{
    width:100%;min-height:80px;background:var(--surface2);border:2px solid var(--line);
    border-radius:14px;color:var(--ink);padding:12px;font-family:'Noto Sans Thai',sans-serif;font-size:0.95rem;resize:vertical;
  }
  .reflect-q{font-weight:800;margin-top:18px;margin-bottom:6px;font-size:1rem;}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  th,td{padding:8px 6px;border-bottom:2px solid var(--surface2);text-align:left;}
  th{color:var(--muted);font-weight:700;}
  footer{color:var(--muted);font-size:0.76rem;margin-top:30px;line-height:1.7;font-family:'Noto Sans Thai',sans-serif;}
  footer a{color:var(--pink);}
  .hidden{display:none !important;}
  .small{font-size:0.85rem;color:var(--muted);font-family:'Noto Sans Thai',sans-serif;}
  .disclaimer{
    background:var(--disclaimer-bg);border:2px solid var(--line);border-radius:16px;padding:10px 16px;
    font-size:0.82rem;color:var(--disclaimer-text);margin-bottom:18px;font-family:'Noto Sans Thai',sans-serif;
    line-height:1.5;
  }
  .disclaimer a{color:inherit;font-weight:700;}
  .devplan-title{font-size:1.1rem;font-weight:800;margin-bottom:12px;}
  .devplan-card{background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:3px 3px 0 var(--shadow-color);}
  .devplan-card.priority{border-color:var(--pink);box-shadow:4px 4px 0 var(--pink);}
  .devplan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .devplan-head b{font-size:0.95rem;}
  .devplan-tag{font-size:0.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);}
  .devplan-tag.ok{background:var(--good);color:#0B0B10;}
  .devplan-action{font-size:0.87rem;margin:6px 0;font-family:'Noto Sans Thai',sans-serif;}
  .devplan-links{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .devplan-links a{color:var(--pink);font-size:0.82rem;text-decoration:none;font-family:'Noto Sans Thai',sans-serif;}
  .devplan-links a:hover{text-decoration:underline;}
  .devplan-links .src-tag{color:var(--muted);font-size:0.72rem;}
  .devplan-qa{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .devplan-qa-item{font-size:0.8rem;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .devplan-qa-item .qtext-mini{color:var(--muted);flex:1;font-family:'Noto Sans Thai',sans-serif;line-height:1.4;}
  .devplan-qa-item .ans-mini{font-weight:800;white-space:nowrap;font-size:0.75rem;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 8px;}
  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
    background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;
    font-weight:800;font-size:0.9rem;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow-color);
    opacity:0;transition:opacity .25s ease, transform .25s ease;z-index:10000;max-width:90vw;text-align:center;
    font-family:'Noto Sans Thai',sans-serif;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  /* Confirm modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
    z-index:10001;padding:20px;
  }
  .modal-card{
    background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:6px 6px 0 var(--shadow-color);max-width:360px;width:100%;text-align:center;
  }
  .modal-card p{font-size:0.95rem;margin-bottom:16px;font-family:'Noto Sans Thai',sans-serif;font-weight:600;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;}
  .about-card{max-width:520px;max-height:80vh;overflow-y:auto;text-align:left;}
  .about-card p{font-weight:400;text-align:left;}
  .about-card li{font-size:0.85rem;color:var(--muted);margin-bottom:4px;}
  #confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:9999;}
  /* Trend insight */
  .trend-card{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
  .trend-row{display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;padding:4px 0;}
  .trend-delta{font-weight:800;padding:2px 8px;border-radius:999px;font-size:0.78rem;}
  .trend-delta.up{background:var(--good);color:#0B0B10;}
  .trend-delta.down{background:var(--bad);color:#fff;}
  .trend-delta.flat{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
  /* Peer comparison */
  .compare-wrap{margin-bottom:14px;}
  .compare-label{display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;margin-bottom:4px;}
  .compare-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .compare-tag{font-size:0.7rem;font-weight:800;width:34px;flex-shrink:0;}
  .compare-bg{flex:1;height:12px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;overflow:hidden;}
  .compare-fill{height:100%;border-radius:999px;}
  .compare-fill.self{background:var(--accent);}
  .compare-fill.peer{background:var(--pink);}
  .compare-val{font-size:0.72rem;color:var(--muted);width:32px;text-align:right;flex-shrink:0;}
  .scaffold-text{background:var(--surface2);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:0.82rem;color:var(--muted);margin-bottom:8px;font-family:'Noto Sans Thai',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="eyebrow" id="eyebrowTag">🧪 SELF-CHECK</span>
    <div class="toggles">
      <button class="toggle-btn" id="aboutToggle" onclick="openAbout()">ℹ️</button>
      <button class="toggle-btn" id="langToggle" onclick="toggleLang()">EN</button>
      <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
    </div>
  </div>
  <header>
    <img src="assets/logo.svg" alt="Cognitive Blind Spot mascot logo" width="88" height="88" style="margin-bottom:6px;">
    <h1 id="hTitle">คนตาบอดทางความคิด</h1>
    <p id="hSubtitle">Cognitive Blind Spot Self-Test — เครื่องมือสะท้อนตัวเอง (self-reflection)</p>
  </header>

  <div class="disclaimer" id="disclaimerText"></div>

  <!-- INTRO -->
  <div id="intro" class="card">
    <p id="introP1"></p>
    <ul class="small" id="introList"></ul>
    <p class="small" id="introP2"></p>
    <p class="small" id="randomNote" style="font-weight:700;"></p>
    <div id="historyPreview"></div>
    <div class="btn-row">
      <button class="btn" id="startBtn" onclick="startQuiz()"></button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="card hidden">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div class="qcount"></div>
    <div class="qtext"></div>
    <div class="mood-grid" id="likertOptions"></div>
    <div class="btn-row">
      <button class="btn secondary" id="prevBtn" onclick="prevQ()"></button>
      <button class="btn" id="nextBtn" onclick="nextQ()" disabled></button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results" class="card hidden">
    <div class="overall">
      <div class="small" id="scoreLabel"></div>
      <div class="score-ring"><div class="score" id="overallScore">-</div></div>
      <div id="overallBadge"></div>
    </div>
    <div id="domainBars"></div>
    <div id="trendSection" style="margin-top:16px;"></div>
    <hr style="border-color:var(--surface2);border-width:2px;margin:20px 0;">
    <div id="interpretation"></div>

    <hr style="border-color:var(--surface2);border-width:2px;margin:20px 0;">
    <div id="devPlanTeaser">
      <div class="devplan-title" id="devPlanTeaserTitle"></div>
      <p class="small" id="devPlanTeaserDesc" style="margin-bottom:12px;"></p>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn" id="devPlanViewBtn" onclick="openDevPlanDetail()"></button>
      </div>
    </div>

    <div style="margin-top:24px;">
      <div class="reflect-q" id="peerShareTitle"></div>
      <p class="small" id="peerShareDesc"></p>
      <div class="btn-row">
        <button class="btn secondary" id="peerShareBtn" onclick="generatePeerLink()"></button>
      </div>
    </div>

    <div style="margin-top:24px;">
      <div class="reflect-q" id="steelmanTitle"></div>
      <p class="small" id="steelmanDesc"></p>
      <div class="btn-row" style="margin-top:0;margin-bottom:8px;">
        <button class="btn secondary" id="steelmanScaffoldBtn" onclick="insertScaffold('steelman')" style="flex:0 1 auto;padding:9px 16px;font-size:0.82rem;min-height:36px;"></button>
      </div>
      <textarea id="steelman"></textarea>

      <div class="reflect-q" id="disconfirmTitle"></div>
      <p class="small" id="disconfirmDesc"></p>
      <div class="btn-row" style="margin-top:0;margin-bottom:8px;">
        <button class="btn secondary" id="disconfirmScaffoldBtn" onclick="insertScaffold('disconfirm')" style="flex:0 1 auto;padding:9px 16px;font-size:0.82rem;min-height:36px;"></button>
      </div>
      <textarea id="disconfirm"></textarea>
      <div class="btn-row">
        <button class="btn secondary" id="saveReflectionBtn" onclick="saveReflection()"></button>
      </div>
    </div>

    <div style="margin-top:24px;" id="historySection"></div>

    <div class="btn-row">
      <button class="btn secondary" id="restartBtn" onclick="restartQuiz()"></button>
      <button class="btn secondary" id="exportBtn" onclick="exportResult()"></button>
      <button class="btn secondary" id="clearBtn" onclick="clearHistory()"></button>
    </div>
  </div>

  <!-- PEER-RATING VIEW (activated via ?peer= URL param) -->
  <div id="peerView" class="card hidden">
    <div class="devplan-title" id="peerIntroTitle"></div>
    <p class="small" id="peerIntroDesc"></p>
    <div id="peerQuiz">
      <div id="progressBarPeer"><div id="peerProgressFill"></div></div>
      <div class="qcount" id="peerQcount"></div>
      <div class="qtext" id="peerQtext"></div>
      <div class="mood-grid" id="peerLikertOptions"></div>
      <div class="btn-row">
        <button class="btn secondary" id="peerPrevBtn" onclick="peerPrevQ()"></button>
        <button class="btn" id="peerNextBtn" onclick="peerNextQ()" disabled></button>
      </div>
    </div>
    <div id="peerResults" class="hidden">
      <p class="small" id="peerOverallText" style="font-weight:700;font-size:0.95rem;"></p>
      <div id="peerComparisonBars"></div>
      <div class="disclaimer hidden" id="peerCallout" style="margin-top:14px;"></div>
      <div class="btn-row">
        <button class="btn secondary" id="peerCopyBtn" onclick="copyPeerResult()"></button>
        <button class="btn secondary" id="peerExitBtn" onclick="exitPeerMode()"></button>
      </div>
    </div>
  </div>

  <footer id="footerText"></footer>
</div>

<!-- DEV PLAN DETAIL VIEW (separate page, opened from results) -->
<div id="devPlanView" class="card hidden">
  <div class="btn-row" style="margin-top:0;margin-bottom:14px;">
    <button class="btn secondary" id="devPlanBackBtn" onclick="closeDevPlanDetail()"></button>
  </div>
  <div class="devplan-title" id="devPlanDetailTitle"></div>
  <p class="small" id="devPlanDetailIntro" style="margin-bottom:16px;"></p>
  <div id="devPlanDetailSection"></div>
  <div class="btn-row">
    <button class="btn secondary" id="devPlanBackBtn2" onclick="closeDevPlanDetail()"></button>
  </div>
</div>


<div id="toast" class="hidden"></div>
<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal-card">
    <p id="confirmModalText"></p>
    <div class="modal-actions">
      <button class="btn secondary" id="confirmCancelBtn"></button>
      <button class="btn danger" id="confirmOkBtn"></button>
    </div>
  </div>
</div>
<div id="aboutModal" class="modal-overlay hidden" onclick="closeAboutOnOverlay(event)">
  <div class="modal-card about-card">
    <div class="devplan-title" id="aboutTitle"></div>
    <div class="small" id="aboutBody" style="text-align:left;line-height:1.8;"></div>
    <div class="btn-row">
      <button class="btn" id="aboutCloseBtn" onclick="closeAbout()"></button>
    </div>
  </div>
</div>
<canvas id="confettiCanvas" class="hidden"></canvas>

<script>
// ================= i18n & theme =================
const LANG_KEY = "blindspot_lang_v1";
const THEME_KEY = "blindspot_theme_v1";
let LANG = localStorage.getItem(LANG_KEY) || "th";
let THEME = localStorage.getItem(THEME_KEY) || "dark";

const STR = {
  th: {
    pageTitle: "แบบทดสอบ: คนตาบอดทางความคิด (Cognitive Blind Spot Self-Test)",
    hTitle: "คนตาบอดทางความคิด",
    hSubtitle: "Cognitive Blind Spot Self-Test — เครื่องมือสะท้อนตัวเอง (self-reflection)",
    eyebrowTag: "🧪 เช็คตัวเอง",
    disclaimer: `⚠️ Self-reflection tool เพื่อการศึกษา ไม่ใช่แบบทดสอบจิตวิทยาที่ validate — <a href="javascript:void(0)" onclick="openAbout()" style="color:inherit;text-decoration:underline;">อ่านรายละเอียด</a>`,
    introP1: "แบบทดสอบนี้มี <b>20 ข้อ</b> (ใช้เวลา ~5 นาที) แบ่งเป็น 5 มิติ:",
    introList: [
      "<b>CB</b> — Confirmation Bias (เลือกรับเฉพาะข้อมูลที่ยืนยันความเชื่อเดิม)",

const TOTAL_BANK_SIZE = Object.values(QUESTION_BANK).reduce((sum,arr)=>sum+arr.length, 0);

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Builds one randomized quiz attempt: QUESTIONS_PER_DOMAIN items sampled
// (without replacement) from each domain's pool, then the whole set is
// shuffled so the question order differs every attempt too.
// If forceIndices is given ({CB:[i,i,i,i], IPC:[...], ...}), use those exact
// bank indices instead of sampling randomly — used by peer-rating mode so a
// rater answers the EXACT same items the original person answered.
function buildQuizSet(forceIndices){
  let picked = [];
  Object.keys(QUESTION_BANK).forEach(d=>{
    let indices;
    if(forceIndices && forceIndices[d]){
      indices = forceIndices[d];
    } else {
      const allIdx = QUESTION_BANK[d].map((_,i)=>i);
      indices = shuffleArray(allIdx).slice(0, QUESTIONS_PER_DOMAIN);
    }
    indices.forEach(i=>{
      const q = QUESTION_BANK[d][i];
      picked.push({d, idx:i, t:q.t, reverse:q.reverse});
    });
  });
  return shuffleArray(picked);
}

function startQuiz(){

function renderQuestion(){
  const q = QUESTIONS[current];
  document.querySelector('.qcount').textContent = t('qcount')(current+1, QUESTIONS.length, DOMAINS[q.d].name[LANG]);
  document.querySelector('.qtext').textContent = q.t[LANG];

}

function nextQ(){

function prevQ(){

// ---------- Scoring ----------
function computeScores(){
  const domainSums = {}; const domainCounts = {};
  Object.keys(DOMAINS).forEach(d=>{domainSums[d]=0;domainCounts[d]=0;});
  QUESTIONS.forEach((q,i)=>{
    let raw = answers[i];
    let score = q.reverse ? (6-raw) : raw;
    domainSums[q.d]+=score;
    domainCounts[q.d]+=1;
  });
  const domainScores = {};
  Object.keys(DOMAINS).forEach(d=>{
    domainScores[d] = domainSums[d]/domainCounts[d];
  });
  const overall = Object.values(domainScores).reduce((a,b)=>a+b,0)/Object.keys(domainScores).length;
  return {domainScores, overall};
}

function scoreColor(v){
  if(v < 2.5) return 'var(--bad)';
  if(v < 3.5) return 'var(--mid)';
  return 'var(--good)';
}

function showResults(skipSave){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const {domainScores, overall} = computeScores();

  document.getElementById('overallScore').style.color = scoreColor(overall);
  if(skipSave){
    document.getElementById('overallScore').textContent = overall.toFixed(2);
  } else {
    animateScoreCountUp(overall);
  }

  const badgeEl = document.getElementById('overallBadge');
  let badgeClass, badgeText;
  const badges = t('badges');
  if(overall >= 4.6){ badgeClass='warn'; badgeText=badges.warn; }
  else if(overall >= 3.5){ badgeClass='good'; badgeText=badges.good; }
  else if(overall >= 2.5){ badgeClass='mid'; badgeText=badges.mid; }
  else { badgeClass='risk'; badgeText=badges.risk; }
  badgeEl.innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span>`;

  const barsEl = document.getElementById('domainBars');
  barsEl.innerHTML = '';
  Object.keys(DOMAINS).forEach(d=>{
    const val = domainScores[d];
    const pct = (val/5)*100;
    const div = document.createElement('div');
    div.className = 'domain-bar-wrap';
    div.innerHTML = `
      <div class="domain-bar-label"><span>${d} — ${DOMAINS[d].name[LANG]}</span><span>${val.toFixed(2)} / 5.0</span></div>
      <div class="domain-bar-bg"><div class="domain-bar-fill" style="width:${pct}%;background:${scoreColor(val)}"></div></div>
      <div class="domain-note">${DOMAINS[d].desc[LANG]}</div>
    `;
    barsEl.appendChild(div);
  });

  document.getElementById('interpretation').innerHTML = buildInterpretation(domainScores, overall);
  document.getElementById('devPlanTeaserTitle').textContent = t('devPlanTeaserTitle');
  document.getElementById('devPlanTeaserDesc').textContent = t('devPlanTeaserDesc');
  document.getElementById('devPlanViewBtn').textContent = t('devPlanViewBtn');
  renderTrend(domainScores, overall, skipSave);

  if(!skipSave){
    saveToHistory(domainScores, overall);
    launchConfetti();
  }
  renderHistory();
}

function buildInterpretation(domainScores, overall){
  let weakest = Object.keys(domainScores).reduce((a,b)=> domainScores[a]<domainScores[b]?a:b);
  let html = t('focusLabel')(weakest, DOMAINS[weakest].name[LANG]);
  html += `<p class="small">${RECS[weakest][LANG]}</p>`;
  if(overall >= 4.6){
    html += t('overconfidenceWarning');
  }
  return html;
}

function renderDevPlan(domainScores){
  // Sort domains ascending by score = weakest (needs focus) first
  const sorted = Object.keys(domainScores).sort((a,b)=> domainScores[a]-domainScores[b]);
  let html = '';
  sorted.forEach((d, idx)=>{
    const val = domainScores[d];
    const isPriority = idx === 0;
    const isStrong = val >= 4.0 && idx === sorted.length-1;
    const tagHtml = isPriority
      ? `<span class="devplan-tag">${t('priorityTag')}</span>`
      : (isStrong ? `<span class="devplan-tag ok">${t('okTag')}</span>` : '');
    const links = (READING_LIST[d]||[]).map(r=>
      `<a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.label} <span class="src-tag">(${r.src})</span></a>`
    ).join('');
    // Item-level Q&A for this domain, drawn from the quiz just completed
    const domainQAs = QUESTIONS
      .map((q,i)=>({q, i}))
      .filter(({q})=> q.d === d);
    const qaHtml = domainQAs.map(({q,i})=>{
      const raw = answers[i];
      if(raw === null || raw === undefined) return '';
      const label = LIKERT.find(o=>o.v===raw);
      return `<div class="devplan-qa-item"><span class="qtext-mini">${q.t[LANG]}</span><span class="ans-mini">${LIKERT_EMOJI[raw]} ${label ? label.l[LANG] : raw}</span></div>`;
    }).join('');
    html += `
      <div class="devplan-card ${isPriority?'priority':''}">
        <div class="devplan-head">
          <b>${d} — ${DOMAINS[d].name[LANG]} (${val.toFixed(2)}/5.0)</b>
          ${tagHtml}
        </div>
        <div class="devplan-action">${RECS[d][LANG]}</div>
        <div class="devplan-links">
          <div class="small" style="font-weight:700;">${t('readMoreLabel')}</div>
          ${links}
        </div>
        ${qaHtml ? `<div class="devplan-qa"><div class="small" style="font-weight:700;margin-bottom:4px;">${t('qaTitle')}</div>${qaHtml}</div>` : ''}
      </div>`;
  });
  document.getElementById('devPlanDetailSection').innerHTML = html;
}

// Trend insight: compares this attempt's domain scores against the AVERAGE
// of prior attempts (not just the single last attempt) so a one-off outlier
// doesn't dominate the signal. Uses only data that's already collected —
// no new tracking infrastructure needed.
function renderTrend(domainScores, overall, isLangRerender){
  const el = document.getElementById('trendSection');
  // On a langauge-only re-render, use the same prior snapshot already captured.
  // On a fresh completed attempt, prior snapshot was captured in startQuiz().
  const priorAttempts = priorHistorySnapshot;
  if(!priorAttempts || priorAttempts.length === 0){
    el.innerHTML = `<p class="small">${t('trendNoData')}</p>`;
    return;
  }
  const avgPrior = {};
  Object.keys(DOMAINS).forEach(d=>{
    const vals = priorAttempts.map(h=> h.domains && h.domains[d]).filter(v=> typeof v === 'number');
    avgPrior[d] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  });
  let html = `<div class="trend-card"><div style="font-weight:800;font-size:0.9rem;margin-bottom:6px;">${t('trendTitle')}</div>`;
  Object.keys(DOMAINS).forEach(d=>{
    const prior = avgPrior[d];
    const nowVal = domainScores[d];
    if(prior === null){ return; }
    const delta = nowVal - prior;
    let cls = 'flat', label = t('trendFlat'), arrow = '→';
    if(delta > 0.15){ cls='up'; label=t('trendUp'); arrow='↑'; }
    else if(delta < -0.15){ cls='down'; label=t('trendDown'); arrow='↓'; }
    html += `<div class="trend-row"><span>${d} — ${DOMAINS[d].name[LANG]}</span><span class="trend-delta ${cls}">${arrow} ${label} (${delta>=0?'+':''}${delta.toFixed(2)})</span></div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

// ---------- Peer-Rating Lite ----------
// Encodes: exact bank indices used this attempt + this person's self scores
// into a URL param. No backend — the payload lives entirely in the URL.
function generatePeerLink(){
  const {domainScores, overall} = computeScores();
  const qi = {};
  Object.keys(DOMAINS).forEach(d=> qi[d] = []);
  QUESTIONS.forEach(q=> qi[q.d].push(q.idx));
  const roundedScores = {};
  Object.keys(domainScores).forEach(d=> roundedScores[d] = Number(domainScores[d].toFixed(2)));
  const payload = {v:1, qi, self:{domainScores: roundedScores, overall: Number(overall.toFixed(2))}};
  let encoded;
  try{
    encoded = btoa(JSON.stringify(payload));
  }catch(e){
    console.error('Failed to encode peer payload', e);
    return;
  }
  const url = new URL(location.origin + location.pathname);
  url.searchParams.set('peer', encoded);
  const linkStr = url.toString();
  navigator.clipboard.writeText(linkStr).then(()=>{
    toast(t('peerLinkCopied'));
  }).catch(()=>{
    prompt(t('exportPromptLabel'), linkStr);
  });
}

// Checks the URL for ?peer=... on load. If present and valid, switches the
// whole page into peer-rating mode: the rater answers the SAME items
// (by bank index) the original person answered, then sees a side-by-side
// comparison. Returns true if peer mode was activated.
function checkPeerMode(){
  const params = new URLSearchParams(location.search);
  const peerParam = params.get('peer');
  if(!peerParam) return false;
  let payload;
  try{
    payload = JSON.parse(atob(peerParam));
    if(payload.v !== 1 || !payload.qi || !payload.self || !payload.self.domainScores) throw new Error('malformed payload');
  }catch(e){
    console.error('Invalid peer link', e);
    return false;
  }
  peerSelfData = payload.self;
  peerQuestions = buildQuizSet(payload.qi);
  peerCurrent = 0;
  peerAnswers = new Array(peerQuestions.length).fill(null);
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('peerView').classList.remove('hidden');
  document.getElementById('peerQuiz').classList.remove('hidden');
  document.getElementById('peerResults').classList.add('hidden');
  renderPeerQuestion();
  return true;
}

function computePeerScores(){
  const domainSums = {}; const domainCounts = {};
  Object.keys(DOMAINS).forEach(d=>{domainSums[d]=0;domainCounts[d]=0;});
  peerQuestions.forEach((q,i)=>{

let lastPeerComparison = null; // stashed for copyPeerResult()

function renderPeerResults(skipRecompute){
  const {domainScores, overall} = computePeerScores();

// ---------- Gen-Z UI helpers: toast, confirm modal, confetti, count-up ----------
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  requestAnimationFrame(()=> el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.classList.add('hidden'), 300);
  }, 2400);
}

function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirmModal');
    document.getElementById('confirmModalText').textContent = message;
    overlay.classList.remove('hidden');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    function cleanup(result){
      overlay.classList.add('hidden');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function animateScoreCountUp(target){
  const el = document.getElementById('overallScore');
  if(prefersReducedMotion()){
    el.textContent = target.toFixed(2);
    return;
  }
  const duration = 650;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = (target*eased).toFixed(2);
    if(p<1) requestAnimationFrame(step);
    else el.textContent = target.toFixed(2);
  }
  requestAnimationFrame(step);
}

function launchConfetti(){
  if(prefersReducedMotion()) return;
  const canvas = document.getElementById('confettiCanvas');
  if(!canvas) return;
  canvas.classList.remove('hidden');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#D4FF3D','#FF3D80','#3DFFC1','#FFD23D'];
  const pieces = Array.from({length:70}, ()=>({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.3,
    r: 4+Math.random()*5,
    c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2+Math.random()*3,
    vx: -1.5+Math.random()*3,
    rot: Math.random()*360,
    vr: -6+Math.random()*12
  }));
  let frame = 0;
  const maxFrames = 100;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      ctx.restore();
    });
    frame++;
    if(frame<maxFrames){
      requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.classList.add('hidden');
    }
  }
  draw();
}

// init
applyTheme();
applyLang();
checkPeerMode(); // if URL has ?peer=..., this switches into peer-rating mode
